<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- OEP DIAMOND MOTIF (4 losanges) -->
  <g transform="translate(65, 75)">
    <polygon points="30,0 60,25 30,50 0,25" fill="#4AAED9" />
    <polygon points="65,25 95,50 65,75 35,50" fill="#1B2A4A" />
    <polygon points="30,50 60,75 30,100 0,75" fill="#7B1E1E" />
    <polygon points="-5,25 25,50 -5,75 -35,50" fill="#A62B2B" />
  </g>

  <!-- EUROPEAN STAR integrated into diamonds -->
  <g transform="translate(138, 62)" filter="url(#starGlow)">
    <polygon points="12,0 14.7,8.2 23.4,8.2 16.4,13.3 19,21.5 12,16.4 5,21.5 7.6,13.3 0.6,8.2 9.3,8.2" fill="#F5B731" />
  </g>

  <!-- RING OF SMALL EUROPEAN STARS -->
  <g transform="translate(65, 125)" opacity="0.55">
    <g transform="translate(-25, 45)">
      <polygon points="4,0 5,3 8,3 5.5,5 6.5,8 4,6 1.5,8 2.5,5 0,3 3,3" fill="#F5B731" />
    </g>
    <g transform="translate(-8, 55)">
      <polygon points="4,0 5,3 8,3 5.5,5 6.5,8 4,6 1.5,8 2.5,5 0,3 3,3" fill="#F5B731" />
    </g>
    <g transform="translate(15, 60)">
      <polygon points="4,0 5,3 8,3 5.5,5 6.5,8 4,6 1.5,8 2.5,5 0,3 3,3" fill="#F5B731" />
    </g>
    <g transform="translate(38, 55)">
      <polygon points="4,0 5,3 8,3 5.5,5 6.5,8 4,6 1.5,8 2.5,5 0,3 3,3" fill="#F5B731" />
    </g>
    <g transform="translate(55, 45)">
      <polygon points="4,0 5,3 8,3 5.5,5 6.5,8 4,6 1.5,8 2.5,5 0,3 3,3" fill="#F5B731" />
    </g>
  </g>

  <!-- TEXT: CHAIRE -->
  <text x="170" y="95" font-family="'Georgia', 'Times New Roman', serif" font-size="16" font-weight="bold" letter-spacing="5" fill="#1B2A4A">CHAIRE</text>

  <!-- TEXT: SOCIÉTÉ À MISSION -->
  <text x="170" y="130" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#7B1E1E" font-style="italic">Société à Mission</text>

  <!-- TEXT: EUROPÉENNE -->
  <text x="170" y="163" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#1B2A4A" font-style="italic">Européenne</text>

  <!-- DIVIDER LINE -->
  <line x1="170" y1="178" x2="460" y2="178" stroke="#1B2A4A" stroke-width="1.5" opacity="0.3"/>

  <!-- SUBTITLE: Observatoire de l'Éthique Publique -->
  <text x="170" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4A4A4A" letter-spacing="1">
    <tspan font-weight="bold" fill="#4AAED9">OBSERVATOIRE</tspan>
    <tspan fill="#4A4A4A" font-weight="normal"> DE </tspan>
    <tspan font-weight="bold" fill="#1B2A4A">L'ÉTHIQUE </tspan>
    <tspan font-weight="bold" fill="#7B1E1E">PUBLIQUE</tspan>
  </text>

</svg>