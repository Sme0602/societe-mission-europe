<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradient for SME mini logo -->
    <linearGradient id="smeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ============================================ -->
  <!-- BACKGROUND                                    -->
  <!-- ============================================ -->
  <rect width="800" height="520" fill="#F8F6F2" />

  <!-- ============================================ -->
  <!-- SECTION 1 : LOGO CHAIRE (principal, centre)   -->
  <!-- ============================================ -->

  <!-- OEP Diamonds - centered -->
  <g transform="translate(200, 30)">
    <!-- Top diamond - Light blue -->
    <polygon points="40,0 75,30 40,60 5,30" fill="#4AAED9" />
    <!-- Right diamond - Dark navy -->
    <polygon points="82,30 117,60 82,90 47,60" fill="#1B2A4A" />
    <!-- Bottom diamond - Dark maroon -->
    <polygon points="40,60 75,90 40,120 5,90" fill="#7B1E1E" />
    <!-- Left diamond - Medium red -->
    <polygon points="-2,30 33,60 -2,90 -37,60" fill="#A62B2B" />
  </g>

  <!-- European star on diamonds -->
  <g transform="translate(296, 18)" filter="url(#starGlow)">
    <polygon points="14,0 17.2,9.6 27.4,9.6 19.1,15.5 22.2,25.1 14,19.2 5.8,25.1 8.9,15.5 0.6,9.6 10.8,9.6" fill="#F5B731" />
  </g>

  <!-- Small European stars arc -->
  <g transform="translate(200, 155)" opacity="0.5">
    <g transform="translate(-30, 8)">
      <polygon points="5,0 6.2,3.7 10,3.7 7,6 8,9.7 5,7.4 2,9.7 3,6 0,3.7 3.8,3.7" fill="#F5B731" />
    </g>
    <g transform="translate(-8, 20)">
      <polygon points="5,0 6.2,3.7 10,3.7 7,6 8,9.7 5,7.4 2,9.7 3,6 0,3.7 3.8,3.7" fill="#F5B731" />
    </g>
    <g transform="translate(20, 26)">
      <polygon points="5,0 6.2,3.7 10,3.7 7,6 8,9.7 5,7.4 2,9.7 3,6 0,3.7 3.8,3.7" fill="#F5B731" />
    </g>
    <g transform="translate(48, 20)">
      <polygon points="5,0 6.2,3.7 10,3.7 7,6 8,9.7 5,7.4 2,9.7 3,6 0,3.7 3.8,3.7" fill="#F5B731" />
    </g>
    <g transform="translate(70, 8)">
      <polygon points="5,0 6.2,3.7 10,3.7 7,6 8,9.7 5,7.4 2,9.7 3,6 0,3.7 3.8,3.7" fill="#F5B731" />
    </g>
  </g>

  <!-- Text CHAIRE -->
  <text x="340" y="60" font-family="'Georgia', 'Times New Roman', serif" font-size="18" font-weight="bold" letter-spacing="6" fill="#1B2A4A">CHAIRE</text>

  <!-- Text Société à Mission -->
  <text x="340" y="100" font-family="'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#7B1E1E" font-style="italic">Société à Mission</text>

  <!-- Text Européenne -->
  <text x="340" y="140" font-family="'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#1B2A4A" font-style="italic">Européenne</text>

  <!-- Subtle divider -->
  <line x1="340" y1="155" x2="620" y2="155" stroke="#1B2A4A" stroke-width="1" opacity="0.25"/>

  <!-- Subtitle OEP -->
  <text x="340" y="175" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4A4A4A" letter-spacing="1">
    <tspan font-weight="bold" fill="#4AAED9">OBSERVATOIRE</tspan>
    <tspan fill="#6A6A6A" font-weight="normal"> DE </tspan>
    <tspan font-weight="bold" fill="#1B2A4A">L'ÉTHIQUE </tspan>
    <tspan font-weight="bold" fill="#7B1E1E">PUBLIQUE</tspan>
  </text>

  <!-- ============================================ -->
  <!-- SECTION 2 : PARTENARIAT SME (secondaire)      -->
  <!-- ============================================ -->

  <!-- "En partenariat avec" -->
  <text x="400" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#999999" text-anchor="middle" font-style="italic">En partenariat avec</text>

  <!-- Mini SME logo (simplified arrow+star) -->
  <g transform="translate(340, 238)">
    <!-- Arrow swoosh -->
    <path d="M 8,18 Q 2,12 8,4 L 18,0 L 14,8 L 24,6 Q 18,16 10,20 Z" fill="url(#smeGrad1)" />
    <!-- Circular swoosh -->
    <path d="M 4,22 Q -2,16 2,10" stroke="#E91E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 20,4 Q 26,10 22,16" stroke="#F5A623" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Star -->
    <polygon points="22,0 23.2,3.5 27,3.5 24,5.7 25,9 22,7 19,9 20,5.7 17,3.5 20.8,3.5" fill="#F5B731" />
  </g>

  <!-- SME text -->
  <text x="378" y="253" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B2A4A" letter-spacing="1">SOCIÉTÉ À MISSION EUROPE</text>

  <!-- ============================================ -->
  <!-- SECTION 3 : BARRE BLEUE MARINE                -->
  <!-- ============================================ -->
  <rect x="50" y="290" width="700" height="14" fill="#1B2A4A" rx="2" />

  <!-- ============================================ -->
  <!-- SECTION 4 : NOTE #55                          -->
  <!-- ============================================ -->
  <text x="340" y="350" font-family="'Georgia', 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#1B2A4A" font-style="italic">Note.</text>
  <text x="440" y="350" font-family="'Georgia', 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#C0392B">#55</text>

  <!-- ============================================ -->
  <!-- SECTION 5 : TITRE DE LA NOTE                  -->
  <!-- ============================================ -->
  <text x="400" y="410" font-family="'Georgia', 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1B2A4A" text-anchor="middle" font-variant="small-caps">ÉTUDE PRÉPARATOIRE</text>

  <text x="400" y="450" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" font-style="italic">Une première typologie des</text>
  <text x="400" y="478" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" font-style="italic">modèles alternatifs d'entreprises</text>
  <text x="400" y="506" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle" font-style="italic">en Europe</text>

</svg>